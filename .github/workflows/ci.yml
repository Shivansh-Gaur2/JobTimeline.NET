name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-test-pack:
    runs-on: ubuntu-latest
    env:
      JOBTIMELINE_SQLSERVER_CONNECTION_STRING: Server=localhost,1433;User ID=sa;Password=JobTimeline_2026!;Encrypt=False;TrustServerCertificate=True

    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          MSSQL_SA_PASSWORD: JobTimeline_2026!
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'JobTimeline_2026!' -C -Q 'SELECT 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore JobTimeline.sln

      - name: Build
        run: dotnet build JobTimeline.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test JobTimeline.sln --configuration Release --no-build

      - name: Pack
        run: dotnet pack JobTimeline.sln --configuration Release --no-build --output ./artifacts/packages
