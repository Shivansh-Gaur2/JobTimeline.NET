name: Bug report
description: Report reproducible behavior that differs from the documented or intended behavior.
title: "bug: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve JobTimeline.NET. Do not include secrets, production payloads, or other sensitive data.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the observed behavior and the expected behavior.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Include the smallest code, configuration, and steps needed to reproduce the issue.
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Package version or commit
      description: Enter the package version, or the commit SHA when using source.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include .NET SDK/runtime, operating system, and relevant queue or persistence integration.
    validations:
      required: true
